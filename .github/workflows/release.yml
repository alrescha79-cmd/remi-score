name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0) — leave empty to auto-read from package.json'
        required: false
        default: ''
      release_type:
        description: 'Release type'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - pre-release

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version and tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag push — extract version from the tag ref
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            # Manual trigger with version input — sanitize whitespace
            RAW_INPUT="${{ github.event.inputs.version }}"
            SANITIZED=$(echo "$RAW_INPUT" | tr -d '[:space:]')
            VERSION="${SANITIZED#v}"
          else
            # Manual trigger without version — read from package.json
            VERSION=$(grep -oP '"version":\s*"\K[^"]+' package.json)
          fi

          TAG_NAME="v${VERSION}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Resolved: version=$VERSION, tag_name=$TAG_NAME"

          # Validate tag format (must be like v1.2.3)
          if ! echo "$TAG_NAME" | grep -qP '^v\d+\.\d+\.\d+'; then
            echo "::error::Invalid version format: '$TAG_NAME' — expected vX.Y.Z"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: [resolve-version]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore android/app/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK (arm64-v8a only)
        run: |
          cd android
          # First configure of the included expo gradle-plugin can flake on a fresh runner;
          # retry once with cached gradle state.
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon || \
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

      - name: Rename APK
        run: mv android/app/build/outputs/apk/release/app-release.apk remiscore-arm64-v8a.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-v8a
          path: remiscore-arm64-v8a.apk
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: [resolve-version, build]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREV_TAG"

      - name: Generate Release Notes from commits
        id: release_notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG="${{ steps.prev_tag.outputs.prev_tag }}"
          VERSION="${{ needs.resolve-version.outputs.version }}"

          echo "## What's Changed — v${VERSION}" > release_notes.md
          echo "" >> release_notes.md

          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"%h %s" 2>/dev/null || echo "")
          else
            COMMITS=$(git log --pretty=format:"%h %s" 2>/dev/null || echo "")
          fi

          if [ -n "$COMMITS" ]; then
            echo "$COMMITS" | sed 's/^/* /' >> release_notes.md
          else
            echo "* Various improvements and bug fixes" >> release_notes.md
          fi

          {
            echo 'notes<<EOF'
            cat release_notes.md
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: List APKs
        run: ls -la apks/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag_name }}
          name: RemiScore v${{ needs.resolve-version.outputs.version }}
          body: |
            ## 📥 Download

            | Versi | Cocok Untuk | Link |
            |-------|-------------|------|
            | **arm64-v8a** | HP Android 64-bit / terbaru | [Download](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve-version.outputs.tag_name }}/remiscore-arm64-v8a.apk) |

            > 💡 Tidak tahu pilih yang mana? Coba **arm64-v8a** — cocok untuk hampir semua HP Android modern.

            ---

            ## 🔧 Cara Install

            1. Download APK di tabel atas
            2. Buka **Pengaturan → Keamanan → Aktifkan "Instal dari sumber tidak dikenal"**
            3. Buka file APK dan ikuti instruksi install

            ---

            ${{ steps.release_notes.outputs.notes }}
          files: apks/*.apk
          draft: false
          prerelease: ${{ github.event.inputs.release_type == 'pre-release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
